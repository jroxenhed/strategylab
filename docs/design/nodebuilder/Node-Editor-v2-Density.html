<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Node Editor — Density Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0;
    background: oklch(0.12 0.012 250);
    color: oklch(0.94 0.005 250);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow: hidden;
  }
  input, button, textarea, select {
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
  }
  #root {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .scale-host {
    position: absolute;
    top: 0; left: 0;
    width: 1900px;
    transform-origin: 0 0;
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="editor-data.jsx"></script>
<script type="text/babel" src="editor-primitives.jsx"></script>
<script type="text/babel" src="variant-stream.jsx"></script>
<script type="text/babel" src="tab-menu.jsx"></script>
<script type="text/babel" src="variant-stream-density.jsx"></script>

<script type="text/babel">
function App() {
  const hostRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const DESIGN_W = 1900;
  const DESIGN_H = 1180;

  React.useEffect(() => {
    function fit() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const s = Math.min(w / DESIGN_W, h / DESIGN_H, 1);
      setScale(s);
    }
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  return (
    <div style={{ position: 'absolute', inset: 0, background: 'oklch(0.12 0.012 250)', overflow: 'hidden', display: 'grid', placeItems: 'center' }}>
      <div style={{
        position: 'relative',
        width: DESIGN_W * scale,
        height: DESIGN_H * scale,
      }}>
        <div style={{
          position: 'absolute', top: 0, left: 0,
          width: DESIGN_W, height: DESIGN_H,
          transformOrigin: '0 0',
          transform: `scale(${scale})`,
        }}>
          <VariantStreamDensity />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
