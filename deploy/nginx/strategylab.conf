# StrategyLab: static frontend + same-origin reverse proxy to the backend.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/strategylab;
    index index.html;

    # SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets can be cached hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # walk-forward / optimizer requests can run for minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # F429: Gateway panel "Open screen" — noVNC static assets + websocket bridge
    # to strategylab-novnc (127.0.0.1:6080). Both sit behind whatever edge auth
    # fronts this server block; there is no auth of their own.
    location /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
    }

    location /websockify {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    client_max_body_size 20m;
}
