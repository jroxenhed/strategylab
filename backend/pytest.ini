[pytest]
asyncio_mode = auto
# addopts = -m "not slow" fast-local default: deselects @pytest.mark.slow tests.
# CI / worker runs: override via  --override-ini="addopts="  or  -m ""  to include slow tests.
# Slow tests (ProcessPool / real I/O) belong on the worker via bin/worker-pytest.sh, which
# passes --override-ini="addopts=" so the full suite including slow runs on the worker.
# See also: bin/worker-pytest.sh header for the canonical worker-dispatch contract.
addopts = -m "not slow"
markers =
    slow: marks tests that take >1s wall-clock (ProcessPool spawn, real I/O). Deselect with -m 'not slow'.
